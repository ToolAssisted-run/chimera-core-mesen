name: chimera waterbox core

# The core as Chimera ships it: a sandboxed core.wbx package. Both jobs run
# only on the free content in tests/ (two homebrew games and this
# repository's own EPSM test program), so they need nothing provisioned and
# run on public runners. What a runner cannot run: a game with the real
# YMF288 rhythm ROM (Yamaha's data; the EPSM checks use a made-up 8 KiB file
# to show the file reaches the chip), and the Windows side.

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      kind:
        description: 'dev (rolling) or nightly (dated). Blank means dev.'
        required: false
        default: ''
        type: string
  schedule:
    # 04:00 UTC. A nightly is published only when main moved since the last one;
    # the reusable workflow checks, so an unchanged core costs one idle run.
    - cron: '0 4 * * *'

# Keyed by the EVENT as well as the ref. The nightly schedule and a push to
# main are the same workflow on the same ref, so without the event in the key
# whichever starts second cancels the first - and because the publish depends
# on the gate that was cancelled, the release is skipped with nothing anywhere
# reporting a failure. They collide at all because GitHub runs these crons
# hours late: this one asks for 04:00 and starts around 08:30. A push still
# supersedes an older push on the same ref, which is what cancel-in-progress
# is for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CHIMERA_REF: main

jobs:

  core-gate:
    # The fast half: the sandboxed core must emulate byte-identically to the
    # same sources built for the host, and survive a savestate round-trip
    # around every frame. No Chimera window or display involved.
    name: core test script (native == sandbox == savestates)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Check out Chimera (for the miniBox waterbox host and toolchain)
        uses: actions/checkout@v6
        with:
          repository: ToolAssisted-run/chimera
          ref: ${{ env.CHIMERA_REF }}
          path: chimera-checkout
          submodules: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build build-essential python3

      - name: Check out miniBox
        working-directory: chimera-checkout
        run: git submodule update --init extern/chimera-common-minibox

      - name: Cache the guest toolchain
        uses: actions/cache@v4
        with:
          path: chimera-checkout/extern/chimera-common-minibox/build/meson-cpp
          key: guest-cpp-${{ runner.os }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/.git') }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/meson.build') }}

      - name: Build miniBox (host + C++ guest toolchain)
        run: |
          mb="$PWD/chimera-checkout/extern/chimera-common-minibox"
          [ -f "$mb/build/meson-cpp/build.ninja" ] || meson setup "$mb/build/meson-cpp" "$mb" -Dguest_cpp=true
          meson compile -C "$mb/build/meson-cpp"

      - name: Build the native reference and sandbox drivers
        run: |
          meson setup build/meson-native -Dminibox_dir="$PWD/chimera-checkout/extern/chimera-common-minibox"
          ninja -C build/meson-native

      - name: Build the waterbox core
        run: |
          sh waterbox/setup-guest.sh -m "$PWD/chimera-checkout/extern/chimera-common-minibox"
          ninja -C build/meson-guest

      - name: Core test script (the checks through Chimera's engine run in the other job)
        run: ./waterbox/run-gate.sh

      - name: Upload core.wbx
        uses: actions/upload-artifact@v7
        with:
          name: core-wbx
          path: |
            build/meson-guest/core.wbx
            waterbox/waterbox.config
          retention-days: 90

  frontend-gate:
    # The other half: the package running inside the real frontend (Chimera
    # window, run headless, through the generic waterbox adapter). The
    # emulated WRAM must match the native reference, a setting must arrive
    # through the window's settings, and the package's default keybinds must
    # become the frontend's.
    name: frontend test (Chimera's window) and the checks through chimera-run
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Check out Chimera
        uses: actions/checkout@v6
        with:
          repository: ToolAssisted-run/chimera
          ref: ${{ env.CHIMERA_REF }}
          path: chimera-checkout
          submodules: recursive

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ~/qt
          key: qt-6.12.0-linux-aqt-3.3.0

      - name: Build Chimera (the engine, chimera-run and the window)
        run: chimera-checkout/tools/ci-chimera.sh "$HOME/qt"

      - name: Cache the guest toolchain
        uses: actions/cache@v4
        with:
          path: chimera-checkout/extern/chimera-common-minibox/build/meson-cpp
          key: guest-cpp-${{ runner.os }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/.git') }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/meson.build') }}

      - name: Build miniBox (host + C++ guest toolchain)
        run: |
          mb="$PWD/chimera-checkout/extern/chimera-common-minibox"
          [ -f "$mb/build/meson-cpp/build.ninja" ] || meson setup "$mb/build/meson-cpp" "$mb" -Dguest_cpp=true
          meson compile -C "$mb/build/meson-cpp"

      - name: Build the native reference and the sandbox driver
        run: |
          meson setup build/meson-native -Dminibox_dir="$PWD/chimera-checkout/extern/chimera-common-minibox"
          ninja -C build/meson-native

      - name: Build and install the waterbox core package
        # The commit is the core's authoritative version: this build is the one
        # that publishes the artifact, so what it stamps is what a movie can
        # cite. A package built by hand stamps "+local" instead.
        env:
          CORE_VERSION: ${{ github.sha }}
        run: ./waterbox/build-package.sh -m "$PWD/chimera-checkout/extern/chimera-common-minibox" -r "$PWD/chimera-checkout"

      - name: Chimera's contract tests on the package
        run: |
          mkdir -p package-only
          cp chimera-checkout/build/Cores/mesen.chimeraCore package-only/
          chimera-checkout/build/meson-linux/source/ui/test-packages package-only

      - name: The core test script with the checks through chimera-run
        env:
          CHIMERA_ROOT: ${{ github.workspace }}/chimera-checkout
          MESEN_PACKAGE: ${{ github.workspace }}/chimera-checkout/build/Cores/mesen.chimeraCore
        run: ./waterbox/run-gate.sh

      - name: Frontend test
        run: ./waterbox/tests/run-frontend.sh --chimera-root "$GITHUB_WORKSPACE/chimera-checkout" --package "$GITHUB_WORKSPACE/chimera-checkout/build/Cores/mesen.chimeraCore" --qt-lib "$HOME/qt/6.12.0/gcc_64/lib"

      - name: Publish the core package
        uses: actions/upload-artifact@v7
        with:
          name: mesen-${{ github.sha }}
          path: chimera-checkout/build/Cores/mesen.chimeraCore
          if-no-files-found: error

      - name: Upload the frontend work dir on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-gate-work
          path: waterbox/tests/work/

  publish:
    # What the gates passed, published as this core's own release: a rolling
    # `dev` on every green push to main, an immutable `nightly-YYYY-MM-DD` from
    # the scheduled run. Chimera ships no cores and downloads none: a user
    # downloads the package from here and puts it in Chimera's Cores folder.
    #
    # The logic is Chimera's tools/publish-core.sh, called through one reusable
    # workflow, so every core publishes the same way and there is one place to
    # change it.
    name: publish
    needs: [ core-gate, frontend-gate ]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: ToolAssisted-run/chimera/.github/workflows/publish-core.yml@main
    with:
      core-id: mesen
      artifact: mesen-${{ github.sha }}
      package: mesen.chimeraCore
      kind: ${{ github.event.inputs.kind }}
